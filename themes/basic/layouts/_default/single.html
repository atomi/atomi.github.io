{{ partial "header.html" . }}
<section class="post">
<div class="prevnext">
  {{ if .Next }}
  {{ with .Next }}
      <a href="{{ .RelPermalink }}" title="{{.Title}}"> Prev</a>
  {{ end }}
    {{ else }}
    Prev
  {{ end }}
  |
  {{ if .Prev}}
  {{ with .Prev }}
          <a href="{{ .RelPermalink }}" title="{{.Title}}">Next</a>
  {{ end }}
  {{ else }}
  Next
  {{ end }}
</div>

 <div class="date">
   {{ .Date.Format "Mon. January 2, 2006" }}
 </div>
<div class="postcontent">
   {{ .Content }}
</div>
</section>
{{ partial "footer.html" . }}
